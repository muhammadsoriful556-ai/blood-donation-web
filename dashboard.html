<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ইউজার ড্যাশবোর্ড ও আইডি কার্ড</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; }
    body { background-color: #f4f6f9; padding: 20px; display: flex; flex-direction: column; align-items: center; }

    /* স্মার্ট আইডি কার্ড স্টাইল */
    .id-card {
      width: 350px;
      height: 520px;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      overflow: hidden;
      position: relative;
      border: 1px solid #e0e0e0;
      margin-top: 20px;
    }

    .card-header {
      background: linear-gradient(135deg, #8b0000, #b22222);
      color: #fff;
      text-align: center;
      padding: 15px;
    }

    .card-header .bismillah { font-size: 16px; color: #ffd700; }
    .card-header h3 { font-size: 14px; text-transform: uppercase; margin-top: 4px; letter-spacing: 0.5px; }

    .card-body { padding: 20px; text-align: center; }
    
    .profile-img {
      width: 90px; height: 90px;
      border-radius: 50%;
      border: 3px solid #8b0000;
      margin: -10px auto 10px;
      background: #eee;
      object-fit: cover;
    }

    .user-name { font-size: 20px; color: #333; font-weight: bold; }
    .user-id { font-size: 12px; color: #777; margin-bottom: 10px; }

    .status-badge {
      display: inline-block;
      background: #fff3cd; color: #856404;
      padding: 3px 12px; border-radius: 12px;
      font-size: 12px; font-weight: bold; margin-bottom: 15px;
    }

    .info-list { text-align: left; font-size: 14px; line-height: 1.8; color: #444; border-top: 1px dashed #ccc; padding-top: 10px; }

    .card-footer {
      position: absolute; bottom: 0; width: 100%;
      background: #f8f9fa; text-align: center; padding: 10px;
      border-top: 1px solid #eee; font-size: 11px; color: #666;
    }

    .print-btn {
      background: #8b0000; color: #fff; border: none;
      padding: 10px 20px; border-radius: 6px; margin-top: 20px;
      font-size: 16px; cursor: pointer; font-weight: bold;
    }

    @media print {
      body * { visibility: hidden; }
      .id-card, .id-card * { visibility: visible; }
      .id-card { position: absolute; left: 0; top: 0; }
    }
  </style>
</head>
<body>

  <h2>আপনার ডিজিটাল আইডেন্টিটি কার্ড</h2>

  <div class="id-card" id="myCard">
    <div class="card-header">
      <div class="bismillah">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
      <h3>Make Friends With Blood Donation</h3>
    </div>

    <div class="card-body">
      <img src="https://via.placeholder.com/90" class="profile-img" alt="User Image">
      <div class="user-name" id="cardName">ইউজারের নাম</div>
      <div class="user-id">ID: MFWBD-2026-889</div>

      <div class="status-badge">⏳ তথ্য যাচাই করা হচ্ছে</div>

      <div class="info-list">
        <p><strong>ইমেইল:</strong> <span id="cardEmail">...</span></p>
        <p><strong>ফোন:</strong> <span id="cardPhone">...</span></p>
        <p><strong>ঠিকানা:</strong> <span id="cardAddress">...</span></p>
      </div>
    </div>

    <div class="card-footer">
      রক্তদান মহৎ দান | জরুরি সহায়তায় আইডি কার্ডটি প্রদর্শন করুন
    </div>
  </div>

  <button class="print-btn" onclick="window.print()">🖨️ আইডি কার্ড ডাউনলোড / প্রিন্ট করুন</button>

  <script>
    // আগের পেজ থেকে ডাটা লোড করা
    window.onload = function() {
      let data = JSON.parse(localStorage.getItem('userData'));
      if(data) {
        document.getElementById('cardName').innerText = data.name;
        document.getElementById('cardEmail').innerText = data.email;
        document.getElementById('cardPhone').innerText = data.phone;
        document.getElementById('cardAddress').innerText = data.address;
      }
    };
  </script>
</body>
  </html>
