<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>রেজিস্ট্রেশন ও লগইন | Make Friends With Blood Donation</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; }
    body { background-color: #f4f6f9; padding: 20px 10px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    .auth-card { background: #fff; width: 100%; max-width: 500px; padding: 30px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); border-top: 5px solid #8b0000; }
    .bismillah { text-align: center; font-size: 20px; color: #8b0000; font-weight: bold; margin-bottom: 5px; }
    .title { text-align: center; color: #333; margin-bottom: 20px; font-size: 22px; }
    
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; outline: none; font-size: 14px; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    
    .checkbox-group { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-top: 5px; cursor: pointer; color: #b22222; }
    
    .btn { width: 100%; background: #8b0000; color: #fff; border: none; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
    
    /* কনফার্মেশন মোডাল/কার্ড */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 999; }
    .modal-content { background: #fff; padding: 25px; border-radius: 12px; max-width: 400px; width: 90%; text-align: center; }
    .status-icon { font-size: 40px; margin-bottom: 10px; }
    .info-box { background: #f8f9fa; padding: 10px; border-radius: 6px; margin: 15px 0; text-align: left; font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="bismillah">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
    <h2 class="title">রেজিস্ট্রেশন ফর্ম</h2>
    
    <form id="regForm" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label>পুরো নাম</label>
        <input type="text" id="name" placeholder="আপনার নাম লিখুন" required>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>ইমেইল</label>
          <input type="email" id="email" placeholder="example@mail.com" required>
        </div>
        <div class="form-group">
          <label>রক্তের গ্রুপ</label>
          <select id="bloodGroup" required>
            <option value="">সিলেক্ট করুন</option>
            <option value="A+">A+</option><option value="A-">A-</option>
            <option value="B+">B+</option><option value="B-">B-</option>
            <option value="O+">O+</option><option value="O-">O-</option>
            <option value="AB+">AB+</option><option value="AB-">AB-</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>ফোন নম্বর</label>
        <input type="tel" id="phone" placeholder="017XXXXXXXX" required>
        <label class="checkbox-group">
          <input type="checkbox" id="hidePhone"> আমার নম্বর গোপন (Hide) রাখতে চাই
        </label>
      </div>

      <!-- দেশ, বিভাগ, জেলা ও উপজেলা -->
      <div class="grid-3">
        <div class="form-group">
          <label>বিভাগ/রাজ্য</label>
          <select id="division" onchange="loadDistricts()" required>
            <option value="">বিভাগ</option>
            <option value="ঢাকা">ঢাকা</option>
            <option value="চট্টগ্রাম">চট্টগ্রাম</option>
            <option value="পশ্চিমবঙ্গ">পশ্চিমবঙ্গ</option>
          </select>
        </div>
        <div class="form-group">
          <label>জেলা</label>
          <select id="district" required>
            <option value="">জেলা সিলেক্ট করুন</option>
          </select>
        </div>
        <div class="form-group">
          <label>উপজেলা/থানা</label>
          <input type="text" id="upazila" placeholder="উপজেলা" required>
        </div>
      </div>

      <div class="form-group">
        <label>পাসওয়ার্ড</label>
        <input type="password" id="password" placeholder="পাসওয়ার্ড দিন" required>
      </div>

      <button type="submit" class="btn">রেজিস্ট্রেশন করুন</button>
    </form>
  </div>

  <!-- তথ্য যাচাইকরণ পপ-আপ কার্ড -->
  <div id="statusModal" class="modal-overlay">
    <div class="modal-content">
      <div class="status-icon">⏳</div>
      <h3 style="color: #8b0000;">রেজিস্ট্রেশন সফল হয়েছে!</h3>
      <p style="font-size: 13px; color: #666; margin-top: 5px;">আপনার প্রদত্ত তথ্যসমূহ বর্তমানে যাচাই করা হচ্ছে।</p>
      
      <div class="info-box">
        <p><strong>নাম:</strong> <span id="resName"></span></p>
        <p><strong>ইমেইল:</strong> <span id="resEmail"></span></p>
        <p><strong>ফোন:</strong> <span id="resPhone"></span></p>
        <p><strong>ঠিকানা:</strong> <span id="resAddress"></span></p>
      </div>

      <button class="btn" onclick="window.location.href='dashboard.html'">ড্যাশবোর্ডে যান</button>
    </div>
  </div>

  <script>
    // ডাইনামিক জেলা লোড করার ফাংশন
    function loadDistricts() {
      const div = document.getElementById('division').value;
      const distSelect = document.getElementById('district');
      distSelect.innerHTML = '<option value="">জেলা সিলেক্ট করুন</option>';

      let districts = [];
      if(div === 'ঢাকা') districts = ['ঢাকা', 'গাজীপুর', 'নারায়ণগঞ্জ', 'টাঙ্গাইল'];
      else if(div === 'চট্টগ্রাম') districts = ['চট্টগ্রাম', 'কক্সবাজার', 'কুমিল্লা'];
      else if(div === 'পশ্চিমবঙ্গ') districts = ['কলকাতা', 'হাওড়া', 'উত্তর ২৪ পরগনা', 'শিলিগুড়ি'];

      districts.forEach(d => {
        let opt = document.createElement('option');
        opt.value = d; opt.innerText = d;
        distSelect.appendChild(opt);
      });
    }

    // রেজিস্ট্রেশন সাবমিট হলে
    function handleRegister(e) {
      e.preventDefault();
      
      let name = document.getElementById('name').value;
      let email = document.getElementById('email').value;
      let phone = document.getElementById('phone').value;
      let isHidden = document.getElementById('hidePhone').checked;
      let div = document.getElementById('division').value;
      let dist = document.getElementById('district').value;
      let upa = document.getElementById('upazila').value;

      // ফোন নম্বর হাইড করার লজিক
      let displayPhone = isHidden ? phone.substring(0, 3) + "******" + phone.slice(-2) + " (গোপন রাখা হয়েছে)" : phone;

      // লোকাল স্টোরেজে সেভ (ড্যাশবোর্ডে দেখানোর জন্য)
      localStorage.setItem('userData', JSON.stringify({
        name, email, phone: displayPhone, address: `${upa}, ${dist}, ${div}`
      }));

      // কার্ডে মান বসানো
      document.getElementById('resName').innerText = name;
      document.getElementById('resEmail').innerText = email;
      document.getElementById('resPhone').innerText = displayPhone;
      document.getElementById('resAddress').innerText = `${upa}, ${dist}, ${div}`;

      document.getElementById('statusModal').style.display = 'flex';
    }
  </script>
</body>
                                            </html>
